platform:
  data_parquet_dir: <data_parquet_test_dir>
  number_of_workers: 1
  resources_per_worker: {
    "CPU": 1,
    "GPU": 1,
  }
  batch_size: 4
  prefetch_batches: 1
  use_gpu: true

options:
  default: options/options.yaml

  # For prediction Only
  prediction:
    output_dir: <prediction_output_dir>
    filename: <prediction_filename>
    save_point_cloud: true
    extra_save:
      []

  Training:
    total_epochs: 500
    epochs: 500
    model_checkpoint_save_path: null
    model_checkpoint_load_path: <finetuned_ckpt_path>
    pretrain_model_load_path: null

    diffusion_every_n_steps: 1

    Components:
      Classification:
        include: false
      Regression:
        include: false
      Assignment:
        include: false
      Segmentation:
        include: false
        use_full_mask: true
      GlobalGeneration:
        include: false
        diffusion_steps: 2
      ReconGeneration:
        include: false
        diffusion_steps: 2
      TruthGeneration:
        # Template default: every head above is `include: false`. Set `true` for
        # whichever head(s) were enabled in the finetune YAML — this must match
        # the trained checkpoint's active heads, not be chosen independently.
        include: false
        diffusion_steps: 2

    EMA:
      enable: true
      replace_model_after_load: true

  Dataset:
    dataset_limit: 1.0
    normalization_file: <normalization_file>


network:
  default: network/network-20M.yaml

  Body:
    PET:
      feature_drop: 0.0
  ReconGeneration:
    feature_drop: 0.0
  TruthGeneration:
    feature_drop: 0.0

event_info:
  default: event_info/<project_name>_process.yaml

resonance:
  default: resonance/standard_model.yaml
